name: Deploy to Cloudflare

# Publica o sistema no Cloudflare Workers a cada push na main.
#
# Segredos necessários no GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN          token com permissão "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID         ID da conta Cloudflare
#   VITE_SUPABASE_URL             https://<ref>.supabase.co
#   VITE_SUPABASE_PUBLISHABLE_KEY chave "anon"/publishable do Supabase
#   SUPABASE_SERVICE_ROLE_KEY     chave service_role do Supabase (só no servidor)
# Opcionais (integrações; deixe em branco se não usar):
#   NEUROCHAT_API_TOKEN, NEUROCHAT_FROM_NUMBER   WhatsApp automático (WTS Chat)
#   MERCADOPAGO_ACCESS_TOKEN, MERCADOPAGO_WEBHOOK_SECRET   pagamento online no portal

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
